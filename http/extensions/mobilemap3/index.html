<!DOCTYPE html>
<html lang="de">

	<head>
		
		<meta http-equiv="content-type" content="text/html; charset=utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

		<title>Geoportal | NetGIS Client</title>
		
		<!-- Library Styles -->
		<link rel="stylesheet" type="text/css" href="./libs/fontawesome/5.12.0/css/all.min.css" />
		<link rel="stylesheet" type="text/css" href="./libs/openlayers/10.0.0/ol.css" />

		<!-- Custom Styles -->
		<link rel="stylesheet" type="text/css" href="./dist/netgis.min.css" />
		<link rel="stylesheet" type="text/css" href="./src/netgis/Theme.css" onerror="this.remove();" />
		
		<!-- Implementation Style -->
		<style>
			
			html, body
			{
				font-family: Arial, sans-serif;
			}
			
			#container
			{
				position: absolute;
				left: 0mm;
				top: 0mm;
				width: 100%;
				height: 100%;
			}
			
			.netgis-map
			{
				background: white;
			}
			
		</style>
		
	</head>
	
	<body>
		
		<!-- Client Container -->
		<main id="container">
		</main>
		
		<!-- Library Scripts -->
		<script type="text/javascript" src="./libs/openlayers/10.0.0/dist/ol.js"></script>
		<script type="text/javascript" src="./libs/proj4js/2.6.0/dist/proj4.js"></script>
		<script type="text/javascript" src="./libs/jsts/1.6.1/jsts.min.js"></script>
		<script type="text/javascript" src="./libs/shapefilejs/4.0.2/dist/shp.js"></script>
		<script type="text/javascript" src="./libs/jspdf/1.3.2/dist/jspdf.min.js"></script>
		<script type="text/javascript" src="./libs/gifjs/0.2.0/dist/gif.js"></script>
		<script type="text/javascript" src="./libs/sqljs/1.8.0/sql.js"></script>
		<script type="text/javascript" src="./libs/geopackage/4.2.3/geopackage.min.js"></script>
		
		<!-- Custom Scripts -->
		<script type="text/javascript" src="./dist/netgis.min.js"></script>
		<script type="text/javascript" src="./config.js"></script>
		
		<!-- Implementation Script -->
		<script type="text/javascript">
			var client = new netgis.Client( "container", config );
		</script>
	</body>
	
</html>
